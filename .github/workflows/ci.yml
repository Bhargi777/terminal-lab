name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check all shell scripts
        run: ./tests/syntax-check.sh

      - name: CLI smoke test
        run: ./tests/cli-smoke-test.sh

      - name: Platform detection test
        run: ./tests/platform-detection-test.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax check all shell scripts
        run: ./tests/syntax-check.sh

      - name: CLI smoke test
        run: ./tests/cli-smoke-test.sh

      - name: Platform detection test
        run: ./tests/platform-detection-test.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell syntax check
        shell: pwsh
        run: ./tests/windows-syntax-check.ps1
