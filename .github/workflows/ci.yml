name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check all shell scripts
        run: ./tests/syntax-check.sh

      - name: CLI smoke test
        run: ./tests/cli-smoke-test.sh
